[package]
name = "rv"
version = "0.9.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Jermalk/rustedvino-oe"
description = "RustedVINO admin CLI — Rust port of scripts/rv. Deliberately has NO dependency on the rustedvino library, so it never links OpenVINO."

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
